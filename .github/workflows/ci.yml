# Lo mismo que se corre antes de subir un cambio: lint, tipos, pruebas y el
# build de producción. Si algo falla, el PR lo muestra antes de unirlo a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      # tsc -b y vite build: los tipos y el paquete que se publica.
      - name: Build
        run: npm run build

  # Las pruebas de pantalla: recorren la app en el tamaño de un iPhone, como el
  # productor. Si fallan, el informe con lo que se vio queda en el resumen.
  pantallas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas de pantalla
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-pantallas
          path: |
            playwright-report
            test-results
          retention-days: 7
